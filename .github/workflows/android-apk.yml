name: Android APK

# Builds a sideload release APK (debug-signed) and uploads SecondBrain-Android.apk.
# Separate from the Windows installer workflow so Windows stays green independently.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build SecondBrain-Android.apk
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Android
        run: flutter config --enable-android

      # whisper_ggml requires NDK 29; accept licenses non-interactively.
      - name: Install Android NDK 29
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          fi
          if [ -z "${SM:-}" ] || [ ! -x "$SM" ]; then
            echo "sdkmanager not found under $SDK" >&2
            ls -la "$SDK" || true
            exit 1
          fi
          echo "Using $SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/tmp/android-licenses.txt || true
          "$SM" --sdk_root="$SDK" "ndk;29.0.13113456"
          test -d "$SDK/ndk/29.0.13113456"

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (no fatal infos)
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Stage artifact name
        shell: bash
        run: |
          mkdir -p dist
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$SRC"
          cp "$SRC" dist/SecondBrain-Android.apk
          ls -lh dist/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecondBrain-Android
          path: dist/SecondBrain-Android.apk
          if-no-files-found: error
          retention-days: 30

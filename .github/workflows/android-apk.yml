name: Android APK

# Builds a sideload release APK (debug-signed) and uploads SecondBrain-Android.apk.
# Separate from the Windows installer workflow so Windows stays green independently.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build SecondBrain-Android.apk
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Android
        run: flutter config --enable-android

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (no fatal infos)
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Stage artifact name
        shell: bash
        run: |
          mkdir -p dist
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$SRC"
          cp "$SRC" dist/SecondBrain-Android.apk
          ls -lh dist/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecondBrain-Android
          path: dist/SecondBrain-Android.apk
          if-no-files-found: error
          retention-days: 30

name: Windows installer

# Builds Flutter Windows Release + Inno Setup .exe on free GitHub-hosted Windows runners.
# Download the artifact from the Actions run (or use a Release when published).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build SecondBrain-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (no fatal infos)
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Read app version from pubspec
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
          $v = $line.Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v"

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $release = Resolve-Path "build\windows\x64\runner\Release"
          & $iscc `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceDir=$release" `
            "/DOutputDir=$(Resolve-Path dist)" `
            "installer\windows\SecondBrain.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecondBrain-Setup-Windows
          path: dist/SecondBrain-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      # Soft unsigned GitHub Release on main only (in-app update checker prefers Releases).
      # continue-on-error: same tag on later main pushes should not fail the installer job.
      - name: Publish GitHub Release (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: SecondBrain ${{ steps.ver.outputs.version }}
          body: |
            Windows installer (unsigned). Install over previous version; AppData settings are kept.
            Bump `pubspec.yaml` version for a new Release tag.
          files: dist/SecondBrain-Setup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
